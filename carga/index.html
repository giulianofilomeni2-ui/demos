<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carga">
<meta name="description" content="Plan de entrenamiento con los kilos exactos para cada ejercicio. Fuerza, hipertrofia, potencia y rugby. Proyecto conceptual de Giuliano Filomeni.">
<title>Carga Progresiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: una columna tipo app (máx. 560px) con mosaicos de 2 columnas y barra de pestañas fija abajo. Mundo oscuro deliberado, como la referencia: el color solo aparece en los discos. */
:root{
  --bg:#09090A; --card:#18181B; --card-hi:#1F1F23; --edge:rgba(255,255,255,.07); --line:rgba(255,255,255,.08);
  --ink:#F5F5F6; --ink-2:#B4B4BB; --muted:#7C7C85; --dim:#3A3A40; --faint:#232328; --chip:#232327;
  --good:#7BE0A6; --warn:#F5C451; --bad:#FF8A80; --surface:#18181B;
  --p25:#E5383F; --p20:#3A6FE0; --p15:#F2C230; --p10:#35A866; --p5:#EDEDED; --p1:#A0A6B0; --steel:#6E737B;
  --f:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-data:"Onest",system-ui,sans-serif;
  --r:26px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
p,h1,h2,h3,h4{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 120px;min-height:100vh}
.app.bare{padding-bottom:40px}
main{display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 10px}
.hello{color:var(--muted);font-size:14px;font-weight:500}
.title{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.02;text-wrap:balance}
.round{width:52px;height:52px;border-radius:50%;border:0;background:var(--chip);display:grid;place-items:center;flex:none}
.round:hover{background:#2C2C31}
.round svg{width:22px;height:22px}
.round.sm{width:42px;height:42px}
.round.sm svg{width:18px;height:18px}
.head-btns{display:flex;gap:10px}
.label{font-size:13px;font-weight:600;color:var(--muted);margin:14px 4px 2px;letter-spacing:.01em}

.card{position:relative;background:linear-gradient(160deg,#1E1E22 0%,#151518 100%);border:1px solid var(--edge);border-radius:var(--r);padding:20px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:168px;text-align:left;color:inherit;width:100%}
button.card:hover{border-color:rgba(255,255,255,.14)}
.t-lg{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.t-md{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.t-sub{font-size:14px;color:var(--muted)}
.big{font-size:56px;font-weight:600;letter-spacing:-.045em;line-height:.95}
.big small,.kg small{font-size:.42em;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.mid{font-size:38px;font-weight:600;letter-spacing:-.04em;line-height:1}
.corner{position:absolute;top:16px;right:16px;color:var(--dim)}
.corner svg{width:22px;height:22px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--chip);color:var(--ink-2)}
.pill.on{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 20px;border-radius:999px;border:0;background:var(--chip);font-weight:600;font-size:15px}
.btn:hover{background:#2C2C31}
.btn.w{background:var(--ink);color:var(--bg)}
.btn.w:hover{background:#fff}
.btn.full{width:100%}
.btn.sm{min-height:36px;padding:7px 14px;font-size:13.5px}
.btn.ghost{background:none;color:var(--ink-2)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Hoy */
.hero{display:flex;flex-direction:column;gap:18px}
.hero-row{display:flex;align-items:center;gap:16px}
.ring{flex:none;display:block}
.ring .bg{stroke:var(--dim)}
.ring .fg{stroke:var(--ink)}
.ring text{fill:var(--ink);font-family:var(--f);font-weight:600}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.plist li:first-child{border-top:0}
.plist b{font-weight:500;min-width:0}
.plist span{color:var(--ink-2);white-space:nowrap;font-weight:500}

/* Calendario de puntos */
.cal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cal-m{display:flex;flex-direction:column;gap:10px;align-items:center}
.cal-m b{font-size:13px;font-weight:600}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal-g i{width:5px;height:5px;border-radius:50%;background:var(--dim);display:block;margin:auto}
.cal-g i.f{background:var(--faint)}
.cal-g i.x{visibility:hidden}
.cal-g i.d{width:8px;height:8px;background:var(--ink)}
.cal-g i.t{box-shadow:0 0 0 2px var(--muted)}

/* Mosaicos del plan */
.wt{min-height:178px}
.wt .ring{margin-bottom:auto}
.add-tile{border-style:dashed;border-color:var(--dim);background:none;display:grid;place-items:center;color:var(--dim);min-height:178px}
.add-tile svg{width:56px;height:56px}
.add-tile span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:6px}
.sug{display:flex;flex-direction:column;gap:12px}
.sug-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.sug-item div{min-width:0}
.sug-item b{display:block;font-weight:600;font-size:15px}
.sug-item span{font-size:13px;color:var(--muted)}

/* Entreno */
.wk-head{display:flex;align-items:center;gap:12px;margin:4px 0 6px}
.wk-head .title{font-size:30px;flex:1;min-width:0}
.ex{display:flex;flex-direction:column;gap:14px}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.ex-top>div{min-width:0}
.kg{font-size:40px;font-weight:600;letter-spacing:-.04em;line-height:1;white-space:nowrap;text-align:right}
.kg-txt{font-size:15px;font-weight:600;color:var(--ink-2);text-align:right;max-width:150px}
.unit{display:block;font-size:12px;color:var(--muted);text-align:right;margin-top:4px;font-weight:500}
.lines{font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.sets{display:flex;flex-wrap:wrap;gap:10px}
.set{width:48px;height:48px;border-radius:50%;border:2px solid var(--dim);background:none;font-weight:600;font-size:15px;display:grid;place-items:center;position:relative}
.set.top::after{content:"";position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid var(--bg)}
.set.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.plates{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pl{display:inline-flex;align-items:center;gap:3px}
.pl i{display:inline-block;width:6px;border-radius:2px}
.adj{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--faint);border-radius:999px;padding:4px}
.adj span{font-size:13px;color:var(--muted);font-weight:500}
.adj button{width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);font-size:20px;font-weight:500;display:grid;place-items:center}
.fb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fb button{border:1px solid var(--dim);background:none;border-radius:14px;padding:10px 6px;font-size:13.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.fb button small{font-size:11.5px;color:var(--muted);font-weight:500}
.fb button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fb button[aria-pressed="true"] small{color:#555}
details.how summary{cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:600;list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"+ "}
details.how[open] summary::before{content:"− "}
details.how ul{margin:10px 0 0;padding-left:18px;color:var(--ink-2);font-size:14px;display:flex;flex-direction:column;gap:5px}
.warm{font-size:13px;color:var(--muted)}
.bar-bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(9,9,10,0) 0%,rgba(9,9,10,.92) 30%)}
.bar-bottom>div{max-width:528px;margin:0 auto;display:flex;gap:10px}

/* Formularios */
.inp{height:52px;width:100%;min-width:0;border:1px solid var(--edge);background:var(--faint);border-radius:16px;padding:0 16px;font-size:16px}
.inp:focus{border-color:var(--ink-2);outline:none}
select.inp{appearance:auto}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;color:var(--muted);font-weight:600}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--edge);background:var(--card);border-radius:18px;padding:15px 18px;width:100%}
.opt b{font-weight:600;font-size:16px}
.opt span{font-size:13.5px;color:var(--muted)}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt[aria-pressed="true"] span{color:#4a4a50}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{border:1px solid var(--edge);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:600;font-size:14.5px}
.chipb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days .chipb{padding:12px 0;text-align:center}
.sv{display:flex;flex-direction:column;gap:22px;min-height:calc(100vh - 80px)}
.sv-prog{display:flex;gap:4px}
.sv-prog i{flex:1;height:4px;border-radius:2px;background:var(--dim)}
.sv-prog i.on{background:var(--ink)}
.sv-q{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
.sv-help{color:var(--muted);font-size:15px;max-width:52ch}
.sv-body{display:flex;flex-direction:column;gap:16px}
.sv-nav{display:flex;gap:10px;margin-top:auto;padding-top:10px}
.sv-nav .btn.w{flex:1}
.err{color:var(--bad);font-size:14px;font-weight:600}
.lift-in{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 1fr;gap:10px;align-items:end}
.lift-in b{font-weight:600;font-size:15px;padding-bottom:15px}
.e1{font-size:12.5px;color:var(--muted);grid-column:2/-1;margin-top:-4px}

/* Listas tipo ajustes */
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);font-size:15px}
.li:first-child{border-top:0;padding-top:0}
.li span{color:var(--muted)}
.li b{font-weight:500;text-align:right}
.edit-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.edit-row:first-child{border-top:0;padding-top:0}
.edit-row .nm b{display:block;font-weight:600;font-size:15px}
.edit-row .nm span{font-size:12.5px;color:var(--muted)}
.edit-ctl{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:4px;background:var(--faint);border-radius:999px;padding:3px}
.mini button{width:32px;height:32px;border-radius:50%;border:0;background:var(--chip);font-size:17px;display:grid;place-items:center}
.mini b{min-width:62px;text-align:center;font-size:13.5px;font-weight:600}
.mini input{width:70px;height:32px;border:0;background:none;text-align:center;font-weight:600;font-size:14px}
.icon{width:36px;height:36px;border-radius:50%;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.icon:hover{background:var(--chip);color:var(--ink)}
.icon svg{width:17px;height:17px}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--bad);font-weight:600;font-size:14px}

/* Semana */
.blocks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.blocks i{height:8px;border-radius:4px;background:var(--dim)}
.blocks i.on{background:var(--ink)}
.blocks i.past{background:var(--muted)}
.wrow{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.wrow:first-child{border-top:0}
.wrow .d{width:44px;flex:none;font-weight:600;color:var(--muted);font-size:14px}
.wrow.today .d{color:var(--ink)}
.wrow .n{flex:1;min-width:0;font-weight:600}
.wrow .n.off{color:var(--dim);font-weight:500}
.wrow .s{font-size:13px;color:var(--muted)}
.dot-ok{width:10px;height:10px;border-radius:50%;background:var(--ink);flex:none}

/* Progreso */
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--faint);overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:9px 12px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chart{position:relative;min-width:0;margin:0 -4px}
.chart svg{display:block;width:100%;height:auto;max-width:100%;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:500 11px var(--f)}
.chart .end{fill:var(--ink);font:600 12px var(--f)}
.chart .xh{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3;visibility:hidden}
.chart .xh-dot{visibility:hidden}
.tip{position:absolute;width:160px;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.35;display:flex;flex-direction:column;z-index:2}
.tip b{font-size:14px}
.chart-empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:14px}
.hist li{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:baseline}
.hist .dt{font-size:13px;color:var(--muted)}
.hist .vl{font-size:13px;color:var(--muted)}

/* Coach */
.chat{display:flex;flex-direction:column;gap:10px}
.turn{font-size:15px;line-height:1.55;display:flex;flex-direction:column;gap:8px;max-width:92%}
.turn.me{align-self:flex-end;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:20px 20px 6px 20px}
.turn.ai{align-self:flex-start;background:var(--card-hi);border:1px solid var(--edge);padding:12px 16px;border-radius:20px 20px 20px 6px}
.turn.ai ul,.turn.ai ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.turn.ai h4{font-size:15px}
.turn .note{color:var(--muted);font-size:13px}
.ask{display:flex;gap:8px;align-items:flex-end}
.ask textarea{flex:1;min-height:52px;height:52px;padding:14px 16px;resize:none;border-radius:26px}
.ask .round{background:var(--ink);color:var(--bg)}
details.sci summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:600}
details.sci summary::-webkit-details-marker{display:none}
.ev{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.ev b{font-size:14.5px;font-weight:600}
.ev p{font-size:13.5px;color:var(--ink-2)}
.ev a{font-size:13px;color:var(--muted)}

/* Pestañas, hojas, avisos */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(9,9,10,.94);border-top:1px solid var(--line);padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tabbar>div{max-width:528px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:11px;font-weight:600}
.tabbar button svg{width:28px;height:28px}
.tabbar button[aria-current="page"]{color:var(--ink)}
#sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:relative;width:min(560px,100%);max-height:88vh;overflow-y:auto;background:#141417;border:1px solid var(--edge);border-bottom:0;border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pk-list{display:flex;flex-direction:column;gap:2px}
.pk-g{font-size:12px;color:var(--muted);font-weight:700;padding:12px 4px 4px;text-transform:uppercase;letter-spacing:.06em}
.pk-i{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:11px 10px;border-radius:14px;width:100%}
.pk-i:hover{background:var(--chip)}
.pk-i span{font-size:12.5px;color:var(--muted)}
.pk-i.added{background:var(--faint)}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#timer button{border:0;background:#E3E3E6;border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;color:var(--bg)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:40;background:#2A2A2F;color:var(--ink);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.welcome{display:flex;flex-direction:column;gap:22px;padding-top:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;font-size:15px}
.brand svg{width:28px;height:28px}
.example-tag{position:absolute;top:18px;right:18px}
@media (max-width:380px){ .big{font-size:46px} .title{font-size:34px} .kg{font-size:32px} .grid2{gap:10px} .card{padding:16px} .cal-g{gap:5px} }
/* ===== Cristal líquido, isla y movimiento ===== */
body{background:radial-gradient(900px 520px at 12% -8%,rgba(92,112,190,.22),transparent 62%),radial-gradient(700px 480px at 108% 38%,rgba(190,80,110,.11),transparent 60%),radial-gradient(800px 600px at 30% 118%,rgba(70,150,140,.11),transparent 60%),var(--bg);background-attachment:fixed}
.glass,.round,.pill,.chipb{background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(255,255,255,.05),0 8px 24px rgba(0,0,0,.32)}

  'sv-back': () => { if (ui.sv.step === 0) { const ed = ui.sv.edit; ui.sv = null; if (ed) ui.sub = {type: 'settings'}; render(); return; } svKeep(); ui.sv.err = ''; ui.sv.step--; render(); },
  'sv-finish': () => svFinish(),

  'edit-done': () => { const w = curW(); ui.sub = w && w.items.length ? {type: 'workout', wid: w.id} : null; ui.confirm = null; render({anim: true}); window.scrollTo(0, 0); },
